[package]
name = "grid-arcium-fork"
description = "Dynamic generic 2D data structure (Arcium fork)"
version = "0.14.1"
edition = "2018"
license = "MIT"
keywords = ["2D", "array", "matrix", "data-structure", "2D-vector"]
categories = ["science", "data-structures"]
readme = "README.md"
repository = "https://github.com/arcium-hq/grid/tree/row-and-column-getter"
documentation = "https://docs.rs/grid"

[badges.gitlab]
repository = "becheran/grid_ci"
branch = "master"

[badges.maintenance]
status = "actively-developed"

[dependencies]
serde = { version = "1.0.188", features = ["derive"], optional = true }

[dev-dependencies]
criterion = "0.3.6"
rand = "0.8.5"
serde_json = "1.0.106"

[[bench]]
name = "benches"
harness = false

[features]
default = ["std"]            # Default to using the std
std = []
serde = ["std", "dep:serde"]
